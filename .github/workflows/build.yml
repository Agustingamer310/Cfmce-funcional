name: Compilar mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          temurin
          java-version: '8'
      - name: Compilar
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          set -o pipefail
          {
            ls -la
            for z in CFMCE*.zip; do unzip -q -o "$z" -d "x_$z"; done
            F=$(find . -path '*CFMCE-1.12.2/src/main/java/*MrCrayfishFurnitureModCE.java' | head -1)
            if [ -z "$F" ]; then echo "NO ENCONTRE el proyecto. Sube CFMCE-1.12.2.zip"; exit 1; fi
            P="${F%%/src/*}"
            echo "PROJ=$P" >> "$GITHUB_ENV"
            cd "$P"
            chmod +x gradlew
            ./gradlew build --no-daemon --stacktrace
          } 2>&1 | tee "$GITHUB_WORKSPACE/out/build-log.txt"
      - name: Publicar resultado
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cd out
          grep -nE "error:|FAILED|What went wrong|BUILD|Caused by|Could not" build-log.txt | head -150 > resumen.txt || true
          echo "-----COLA-----" >> resumen.txt
          tail -n 80 build-log.txt >> resumen.txt || true
          cp "$GITHUB_WORKSPACE"/${PROJ:-nada}/build/libs/*.jar . 2>/dev/null || true
          git init -q
          git checkout -q -b build-output
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "resultado de la compilacion"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-output
